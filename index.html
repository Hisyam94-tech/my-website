<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitCare | Repair Order Management</title>
    <link rel="icon" type="image/png" href="CIRCUITCARE_new_logo-removebg.png">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        secondary: {
                            50: '#f8fafc',
                            600: '#475569',
                            700: '#334155',
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    animation: {
                        'slide-in': 'slideIn 0.3s ease-out',
                        'fade-in': 'fadeIn 0.2s ease-out',
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateY(-10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-gradient-to-br from-gray-50 to-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const Plus = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Edit = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        );

        const Trash = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const X = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const ArrowLeft = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        );

        const Phone = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
        );

        const Calendar = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const DollarSign = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
        );

        function RepairOrderSystem() {
            const [orders, setOrders] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [viewMode, setViewMode] = useState('dashboard'); // 'dashboard', 'all', 'in-progress', 'completed', 'revenue'
            const [filteredOrders, setFilteredOrders] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            
            const [stats, setStats] = useState({
                total: 0,
                inProgress: 0,
                completed: 0,
                revenue: 0
            });
            
            const formDataInitial = {
                customerName: '',
                phone: '',
                email: '',
                device: '',
                issue: '',
                estimatedCost: '',
                status: 'in-progress',
                dateReceived: new Date().toISOString().split('T')[0],
                endDate: '',
                images: [],
                componentsChanged: []
            };
            
            const [formData, setFormData] = useState(formDataInitial);

            useEffect(() => {
                const savedOrders = localStorage.getItem('repairOrders');
                if (savedOrders) {
                    const parsedOrders = JSON.parse(savedOrders);
                    setOrders(parsedOrders);
                    calculateStats(parsedOrders);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('repairOrders', JSON.stringify(orders));
                calculateStats(orders);
                filterOrdersByViewMode();
            }, [orders, viewMode, searchTerm]);

            const calculateStats = (ordersList) => {
                const stats = {
                    total: ordersList.length,
                    inProgress: ordersList.filter(o => o.status === 'in-progress').length,
                    completed: ordersList.filter(o => o.status === 'completed').length,
                    revenue: ordersList.reduce((sum, order) => sum + parseFloat(order.estimatedCost || 0), 0)
                };
                setStats(stats);
            };

            const filterOrdersByViewMode = () => {
                let filtered = orders;
                
                switch(viewMode) {
                    case 'all':
                        filtered = orders;
                        break;
                    case 'in-progress':
                        filtered = orders.filter(order => order.status === 'in-progress');
                        break;
                    case 'completed':
                        filtered = orders.filter(order => order.status === 'completed');
                        break;
                    case 'revenue':
                        // For revenue view, show all orders sorted by revenue
                        filtered = [...orders].sort((a, b) => parseFloat(b.estimatedCost || 0) - parseFloat(a.estimatedCost || 0));
                        break;
                    default:
                        filtered = orders;
                }

                if (searchTerm && viewMode !== 'dashboard') {
                    filtered = filtered.filter(order =>
                        order.customerName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        order.device.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        order.orderNumber.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                setFilteredOrders(filtered);
            };

            const handleCardClick = (mode) => {
                setViewMode(mode);
            };

            const generateOrderNumber = () => {
                if (orders.length === 0) {
                    return 'CC00001';
                }
                
                const numbers = orders.map(order => {
                    const match = order.orderNumber.match(/CC(\d+)/);
                    return match ? parseInt(match[1]) : 0;
                });
                
                const maxNumber = Math.max(...numbers);
                const nextNumber = maxNumber + 1;
                return `CC${String(nextNumber).padStart(5, '0')}`;
            };

            const handleSubmit = () => {
                if (!formData.customerName || !formData.phone || !formData.device || !formData.issue) {
                    alert('Please fill in all required fields');
                    return;
                }
                
                if (editingOrder) {
                    setOrders(orders.map(order => 
                        order.id === editingOrder.id ? { ...formData, id: editingOrder.id, orderNumber: editingOrder.orderNumber } : order
                    ));
                } else {
                    const newOrder = {
                        ...formData,
                        id: Date.now(),
                        orderNumber: generateOrderNumber()
                    };
                    setOrders([...orders, newOrder]);
                }

                resetForm();
            };

            const resetForm = () => {
                setFormData(formDataInitial);
                setShowForm(false);
                setEditingOrder(null);
            };

            const handleImageUpload = (e) => {
                const files = Array.from(e.target.files);
                const imagePromises = files.map(file => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });
                });

                Promise.all(imagePromises).then(images => {
                    setFormData({...formData, images: [...formData.images, ...images]});
                });
            };

            const removeImage = (index) => {
                const newImages = formData.images.filter((_, i) => i !== index);
                setFormData({...formData, images: newImages});
            };

            const addComponent = () => {
                const newComponent = { id: Date.now(), name: '', cost: '' };
                setFormData({...formData, componentsChanged: [...formData.componentsChanged, newComponent]});
            };

            const updateComponent = (id, field, value) => {
                const updated = formData.componentsChanged.map(comp =>
                    comp.id === id ? {...comp, [field]: value} : comp
                );
                setFormData({...formData, componentsChanged: updated});
            };

            const removeComponent = (id) => {
                const filtered = formData.componentsChanged.filter(comp => comp.id !== id);
                setFormData({...formData, componentsChanged: filtered});
            };

            const handleEdit = (order) => {
                setEditingOrder(order);
                setFormData({
                    ...order,
                    componentsChanged: order.componentsChanged || []
                });
                setShowForm(true);
            };

            const handleDelete = (id) => {
                if (confirm('Are you sure you want to delete this order?')) {
                    setOrders(orders.filter(order => order.id !== id));
                }
            };

            const getStatusColor = (status) => {
                const colors = {
                    'in-progress': 'bg-blue-100 text-blue-800 border-blue-200',
                    completed: 'bg-emerald-100 text-emerald-800 border-emerald-200',
                    'Pending-Payment': 'bg-violet-100 text-violet-800 border-violet-200',
                    cancelled: 'bg-rose-100 text-rose-800 border-rose-200'
                };
                return colors[status] || 'bg-gray-100 text-gray-800 border-gray-200';
            };

            const getStatusLabel = (status) => {
                const labels = {
                    'in-progress': 'In Progress',
                    completed: 'Completed',
                    'Pending-Payment': 'Pending Payment',
                    cancelled: 'Cancelled'
                };
                return labels[status] || status;
            };

            const renderDashboard = () => (
                <div className="min-h-screen">
                    {/* Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3">
                                    <img src="CIRCUITCARE_new_logo-removebg.png" alt="CircuitCare" className="h-10 w-10 object-contain" />
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900">CircuitCare</h1>
                                        <p className="text-sm text-gray-600">Repair Management System</p>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setShowForm(true)}
                                    className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-primary-600 to-primary-700 text-white rounded-lg hover:from-primary-700 hover:to-primary-800 transition-all shadow-sm hover:shadow-md"
                                >
                                    <Plus />
                                    <span className="font-medium">New Order</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold text-gray-900 mb-4">Repair Order Dashboard</h2>
                            <p className="text-gray-600 max-w-2xl mx-auto">Click on any card below to view and manage orders in that category</p>
                        </div>

                        {/* Main Dashboard Cards - Only these 4 cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
                            {/* Total Orders Card */}
                            <div 
                                className="bg-white rounded-2xl p-8 border-2 border-gray-200 shadow-lg hover:shadow-2xl hover:border-primary-300 hover:scale-[1.02] transition-all duration-300 cursor-pointer group"
                                onClick={() => handleCardClick('all')}
                            >
                                <div className="flex flex-col items-center text-center">
                                    <div className="p-4 bg-primary-50 rounded-2xl mb-6 group-hover:bg-primary-100 transition-colors">
                                        <svg className="w-12 h-12 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                        </svg>
                                    </div>
                                    <h3 className="text-4xl font-bold text-gray-900 mb-2">{stats.total}</h3>
                                    <p className="text-lg font-semibold text-gray-700 mb-1">Total Orders</p>
                                    <p className="text-sm text-gray-500">View all repair orders</p>
                                    <div className="mt-6 text-primary-600 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                                        <span className="font-medium">Click to view</span>
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            {/* In Progress Card */}
                            <div 
                                className="bg-white rounded-2xl p-8 border-2 border-gray-200 shadow-lg hover:shadow-2xl hover:border-blue-300 hover:scale-[1.02] transition-all duration-300 cursor-pointer group"
                                onClick={() => handleCardClick('in-progress')}
                            >
                                <div className="flex flex-col items-center text-center">
                                    <div className="p-4 bg-blue-50 rounded-2xl mb-6 group-hover:bg-blue-100 transition-colors">
                                        <svg className="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-4xl font-bold text-blue-600 mb-2">{stats.inProgress}</h3>
                                    <p className="text-lg font-semibold text-gray-700 mb-1">In Progress</p>
                                    <p className="text-sm text-gray-500">View active repairs</p>
                                    <div className="mt-6 text-blue-600 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                                        <span className="font-medium">Click to view</span>
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Completed Card */}
                            <div 
                                className="bg-white rounded-2xl p-8 border-2 border-gray-200 shadow-lg hover:shadow-2xl hover:border-emerald-300 hover:scale-[1.02] transition-all duration-300 cursor-pointer group"
                                onClick={() => handleCardClick('completed')}
                            >
                                <div className="flex flex-col items-center text-center">
                                    <div className="p-4 bg-emerald-50 rounded-2xl mb-6 group-hover:bg-emerald-100 transition-colors">
                                        <svg className="w-12 h-12 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-4xl font-bold text-emerald-600 mb-2">{stats.completed}</h3>
                                    <p className="text-lg font-semibold text-gray-700 mb-1">Completed</p>
                                    <p className="text-sm text-gray-500">View finished repairs</p>
                                    <div className="mt-6 text-emerald-600 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                                        <span className="font-medium">Click to view</span>
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Total Revenue Card */}
                            <div 
                                className="bg-white rounded-2xl p-8 border-2 border-gray-200 shadow-lg hover:shadow-2xl hover:border-amber-300 hover:scale-[1.02] transition-all duration-300 cursor-pointer group"
                                onClick={() => handleCardClick('revenue')}
                            >
                                <div className="flex flex-col items-center text-center">
                                    <div className="p-4 bg-amber-50 rounded-2xl mb-6 group-hover:bg-amber-100 transition-colors">
                                        <DollarSign className="w-12 h-12 text-amber-600" />
                                    </div>
                                    <h3 className="text-4xl font-bold text-gray-900 mb-2">RM {stats.revenue.toFixed(2)}</h3>
                                    <p className="text-lg font-semibold text-gray-700 mb-1">Total Revenue</p>
                                    <p className="text-sm text-gray-500">View revenue details</p>
                                    <div className="mt-6 text-amber-600 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
                                        <span className="font-medium">Click to view</span>
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="mt-16 text-center text-sm text-gray-500">
                            <p>CircuitCare Repair Management System • {new Date().getFullYear()} • All rights reserved</p>
                            <p className="mt-1">Version 2.0 • Professional Edition</p>
                        </div>
                    </div>
                </div>
            );

            const renderOrderList = () => {
                const getViewTitle = () => {
                    switch(viewMode) {
                        case 'all': return 'All Orders';
                        case 'in-progress': return 'In Progress Orders';
                        case 'completed': return 'Completed Orders';
                        case 'revenue': return 'Revenue Overview';
                        default: return 'Orders';
                    }
                };

                const getViewDescription = () => {
                    switch(viewMode) {
                        case 'all': return 'All repair orders in the system';
                        case 'in-progress': return 'Orders currently being repaired';
                        case 'completed': return 'Successfully completed repairs';
                        case 'revenue': return 'Orders sorted by revenue (highest first)';
                        default: return '';
                    }
                };

                return (
                    <div className="min-h-screen">
                        {/* Header */}
                        <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-200">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div className="flex items-center justify-between h-16">
                                    <div className="flex items-center gap-3">
                                        <button
                                            onClick={() => setViewMode('dashboard')}
                                            className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                                            title="Back to Dashboard"
                                        >
                                            <ArrowLeft />
                                        </button>
                                        <div>
                                            <h1 className="text-xl font-bold text-gray-900">{getViewTitle()}</h1>
                                            <p className="text-sm text-gray-600">{getViewDescription()}</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setShowForm(true)}
                                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-primary-600 to-primary-700 text-white rounded-lg hover:from-primary-700 hover:to-primary-800 transition-all shadow-sm hover:shadow-md"
                                    >
                                        <Plus />
                                        <span className="font-medium">New Order</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            {/* Search Bar for Order Lists */}
                            <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-sm mb-8">
                                <div className="flex flex-col lg:flex-row gap-4">
                                    <div className="flex-1 relative">
                                        <input
                                            type="text"
                                            placeholder="Search orders..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full pl-4 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                        />
                                    </div>
                                    <div className="text-sm text-gray-600 flex items-center">
                                        {filteredOrders.length} orders found
                                    </div>
                                </div>
                            </div>

                            {/* Order Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredOrders.length === 0 ? (
                                    <div className="col-span-3 text-center py-16">
                                        <div className="mx-auto w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6">
                                            <svg className="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                            </svg>
                                        </div>
                                        <p className="text-gray-700 font-medium mb-2">No orders found</p>
                                        <p className="text-gray-500 text-sm mb-6">
                                            {searchTerm ? 'Try a different search term' : 'Create your first order to get started'}
                                        </p>
                                        {!searchTerm && (
                                            <button
                                                onClick={() => setShowForm(true)}
                                                className="px-6 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors font-medium"
                                            >
                                                Create New Order
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    filteredOrders.map((order) => (
                                        <div 
                                            key={order.id}
                                            className="bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 cursor-pointer group overflow-hidden"
                                            onClick={() => handleEdit(order)}
                                        >
                                            <div className="p-5">
                                                <div className="flex items-start justify-between mb-4">
                                                    <div>
                                                        <h3 className="text-lg font-bold text-gray-900 group-hover:text-primary-600 transition-colors">
                                                            Order #{order.orderNumber}
                                                        </h3>
                                                        <p className="text-sm text-gray-600 mt-1">{order.device}</p>
                                                    </div>
                                                    <span className={`px-3 py-1 rounded-full text-xs font-medium border ${getStatusColor(order.status)}`}>
                                                        {getStatusLabel(order.status)}
                                                    </span>
                                                </div>
                                                
                                                <div className="space-y-3">
                                                    <div>
                                                        <p className="text-sm font-medium text-gray-700">Customer</p>
                                                        <p className="text-base text-gray-900 font-semibold">{order.customerName}</p>
                                                    </div>
                                                    
                                                    <div className="flex items-center gap-4 text-sm text-gray-600">
                                                        <div className="flex items-center gap-2">
                                                            <Phone className="w-4 h-4" />
                                                            {order.phone}
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <Calendar className="w-4 h-4" />
                                                            {order.dateReceived}
                                                        </div>
                                                    </div>
                                                    
                                                    {order.estimatedCost && (
                                                        <div className="flex items-center gap-2 text-sm">
                                                            <span className="font-medium text-gray-700">Cost:</span>
                                                            <span className="text-primary-600 font-bold">RM {order.estimatedCost}</span>
                                                        </div>
                                                    )}
                                                    
                                                    <div className="pt-3 border-t border-gray-100">
                                                        <p className="text-sm font-medium text-gray-700 mb-1">Issue</p>
                                                        <p className="text-sm text-gray-600 line-clamp-2">{order.issue}</p>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex items-center justify-between mt-4 pt-4 border-t border-gray-100">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xs text-gray-500">
                                                            {order.componentsChanged?.length || 0} components
                                                        </span>
                                                        <span className="text-xs text-gray-500">
                                                            {order.images?.length || 0} images
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleEdit(order);
                                                            }}
                                                            className="p-1.5 text-gray-400 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition-colors"
                                                            title="Edit Order"
                                                        >
                                                            <Edit />
                                                        </button>
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleDelete(order.id);
                                                            }}
                                                            className="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                                            title="Delete Order"
                                                        >
                                                            <Trash />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
                    <style>
                        {`
                            ::-webkit-scrollbar {
                                width: 8px;
                                height: 8px;
                            }
                            ::-webkit-scrollbar-track {
                                background: #f1f5f9;
                            }
                            ::-webkit-scrollbar-thumb {
                                background: #cbd5e1;
                                border-radius: 4px;
                            }
                            ::-webkit-scrollbar-thumb:hover {
                                background: #94a3b8;
                            }
                        `}
                    </style>
                    
                    {/* Render Dashboard or Order List based on viewMode */}
                    {viewMode === 'dashboard' ? renderDashboard() : renderOrderList()}

                    {/* Order Form Modal */}
                    {showForm && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-4xl w-full max-h-[90vh] overflow-y-auto animate-slide-in">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold text-gray-900">
                                        {editingOrder ? 'Edit Repair Order' : 'Create New Repair Order'}
                                    </h2>
                                    <button
                                        onClick={resetForm}
                                        className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                                    >
                                        <X />
                                    </button>
                                </div>
                                
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Customer Name *
                                            </label>
                                            <input
                                                type="text"
                                                value={formData.customerName}
                                                onChange={(e) => setFormData({...formData, customerName: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                                placeholder="Enter customer name"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Phone Number *
                                            </label>
                                            <input
                                                type="tel"
                                                value={formData.phone}
                                                onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                                placeholder="Enter phone number"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Email Address
                                            </label>
                                            <input
                                                type="email"
                                                value={formData.email}
                                                onChange={(e) => setFormData({...formData, email: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                                placeholder="Enter email address"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Device *
                                            </label>
                                            <input
                                                type="text"
                                                value={formData.device}
                                                onChange={(e) => setFormData({...formData, device: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                                placeholder="e.g., iPhone 13 Pro, Samsung Galaxy S23"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Estimated Cost (RM)
                                            </label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={formData.estimatedCost}
                                                onChange={(e) => setFormData({...formData, estimatedCost: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                                placeholder="0.00"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Status
                                            </label>
                                            <select
                                                value={formData.status}
                                                onChange={(e) => setFormData({...formData, status: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                            >
                                                <option value="in-progress">In Progress</option>
                                                <option value="completed">Completed</option>
                                                <option value="Pending-Payment">Pending Payment</option>
                                                <option value="cancelled">Cancelled</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Date Received
                                            </label>
                                            <input
                                                type="date"
                                                value={formData.dateReceived}
                                                onChange={(e) => setFormData({...formData, dateReceived: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Completion Date
                                            </label>
                                            <input
                                                type="date"
                                                value={formData.endDate}
                                                onChange={(e) => setFormData({...formData, endDate: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Issue Description *
                                        </label>
                                        <textarea
                                            rows="4"
                                            value={formData.issue}
                                            onChange={(e) => setFormData({...formData, issue: e.target.value})}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                            placeholder="Describe the problem in detail..."
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Upload Device Images
                                        </label>
                                        <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                                            <input
                                                type="file"
                                                accept="image/*"
                                                multiple
                                                onChange={handleImageUpload}
                                                className="hidden"
                                                id="image-upload"
                                            />
                                            <label htmlFor="image-upload" className="cursor-pointer block">
                                                <div className="mx-auto w-12 h-12 bg-primary-50 rounded-full flex items-center justify-center mb-3">
                                                    <svg className="w-6 h-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                                    </svg>
                                                </div>
                                                <p className="text-gray-600">Click to upload or drag and drop</p>
                                                <p className="text-sm text-gray-500 mt-1">PNG, JPG, GIF up to 5MB</p>
                                            </label>
                                        </div>
                                        {formData.images.length > 0 && (
                                            <div className="grid grid-cols-3 gap-3 mt-4">
                                                {formData.images.map((img, index) => (
                                                    <div key={index} className="relative group">
                                                        <img 
                                                            src={img} 
                                                            alt={`Upload ${index + 1}`} 
                                                            className="w-full h-32 object-cover rounded-lg"
                                                        />
                                                        <button
                                                            onClick={() => removeImage(index)}
                                                            className="absolute top-2 right-2 bg-red-500 text-white p-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
                                                        >
                                                            <X />
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div>
                                        <div className="flex items-center justify-between mb-4">
                                            <label className="block text-sm font-semibold text-gray-700">
                                                Components Changed
                                            </label>
                                            <button
                                                type="button"
                                                onClick={addComponent}
                                                className="flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors text-sm font-medium"
                                            >
                                                <Plus className="w-4 h-4" />
                                                Add Component
                                            </button>
                                        </div>
                                        {formData.componentsChanged.length > 0 && (
                                            <div className="space-y-3">
                                                {formData.componentsChanged.map((component) => (
                                                    <div key={component.id} className="flex items-center gap-3">
                                                        <input
                                                            type="text"
                                                            placeholder="Component name"
                                                            value={component.name}
                                                            onChange={(e) => updateComponent(component.id, 'name', e.target.value)}
                                                            className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                                        />
                                                        <input
                                                            type="number"
                                                            step="0.01"
                                                            placeholder="Cost (RM)"
                                                            value={component.cost}
                                                            onChange={(e) => updateComponent(component.id, 'cost', e.target.value)}
                                                            className="w-32 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                                        />
                                                        <button
                                                            onClick={() => removeComponent(component.id)}
                                                            className="p-3 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors"
                                                        >
                                                            <Trash />
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="flex gap-3 pt-6 border-t border-gray-200">
                                        <button
                                            onClick={handleSubmit}
                                            className="flex-1 bg-gradient-to-r from-primary-600 to-primary-700 text-white py-3.5 rounded-lg hover:from-primary-700 hover:to-primary-800 transition-all font-semibold shadow-sm hover:shadow-md"
                                        >
                                            {editingOrder ? 'Update Order' : 'Create Order'}
                                        </button>
                                        <button
                                            onClick={resetForm}
                                            className="flex-1 bg-gray-100 text-gray-700 py-3.5 rounded-lg hover:bg-gray-200 transition-colors font-medium"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<RepairOrderSystem />, document.getElementById('root'));
    </script>
</body>
</html>
